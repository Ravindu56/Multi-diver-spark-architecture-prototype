# mpj-spark multi-driver stack for Docker Swarm — Phase 5 (Obj 1a adaptation).
#
# Replaces Phase 4's docker-compose + NFS-client-volume model with Swarm-native
# equivalents, keeping every rank contract identical:
#   - service names / DNS aliases:  mpi-root, mpi-worker-1, mpi-worker-2
#   - shared storage mount point:   /data  (NFS bind mount, one export /srv/mpj-share)
#   - env contract read by entrypoint.sh: MPI_SIZE / MPI_HOSTS / NFS_* / metrics envs
#   - rank identity + sshd wiring:    unchanged image entrypoint
#
# Swarm-native replacements:
#   docker-compose up            -> docker stack deploy
#   compose service containers   -> one replicated service per rank (placement-pinned)
#   NFS client volume            -> bind mount of /srv/mpj-share (mounted via systemd on every VM)
#   container_name aliases       -> swarm overlay DNS entries + explicit network aliases
#
# MPI-on-Swarm wiring parity fixes (P5 smoke evidence, 2026-09-12):
#   - working_dir: /data + PYTHONPATH=/app: mpj_spark.config falls back to the
#     relative path ./shared_storage for shard staging (it does not honor the
#     legacy MPJ_SHARED_STORAGE host path baked into the image); pinning CWD to
#     the NFS mount makes shard files visible to every rank while keeping the
#     app importable. Propagated to remote ranks by `mpirun -x PYTHONPATH` (see
#     runbook below).
#   - endpoint_mode: dnsrr: VIP-mode service DNS gives each rank name a
#     load-balanced virtual IP; Open MPI's TCP wireup requires each rank name
#     to resolve to a stable per-container IP. dnsrr restores that identity.
#     Consequence: Swarm forbids port publishing in dnsrr mode, so the former
#     4040/4041/4042 host mappings are removed. Access Spark UIs via container
#     overlay IPs (docker inspect) or re-add ports temporarily if needed.
#   - PYTHONUNBUFFERED=1 so per-rank logs stream live during hung-run diagnosis.
#
# Render + deploy from the repo root on the host (or via scripts/bootstrap_stack.sh):
#   set -a; . docker/.env; set +a   # supplies MPI_SIZE, NUM_MPI_WORKERS, NFS_SERVER, ...
#   docker stack deploy -c docker/swarm/stack-mpj-spark.yml mpj
#
# Run a workload (rank 0 orchestrates, shards land on the NFS mount):
#   ROOT=$(docker ps -q -f name=mpj_mpi-root | head -1)
#   docker exec $ROOT bash -lc 'cd /data && export PYTHONPATH=/app PYTHONUNBUFFERED=1 && \
#     mpirun -n $MPI_SIZE --hostfile /etc/mpi/hostfile -x PYTHONPATH -x PYTHONUNBUFFERED \
#       -mca pml ob1 -mca btl tcp,self -mca plm_rsh_args "-p 22" \
#       python -m mpj_spark.applications.kmeans.allreduce \
#         --input /data/input/kmeans_data.csv --k 5 --max-iter 20 \
#         --output /data/results/<run-id>'

name: mpj

x-common-env: &common-env
  # Rank identity wiring consumed by docker/entrypoint.sh
  SPARK_LOCAL_IP: 0.0.0.0
  NFS_SERVER: "${NFS_SERVER:-192.168.122.224}"
  NFS_SHARE: "${NFS_SHARE:-/srv/mpj-share}"
  NFS_CONTAINER_SHARE: "${NFS_CONTAINER_SHARE:-/srv/mpj-share}"
  # Metrics/validation env contract re-exported for workload+
  # validation scripts (read by validate_p4_05..p4_13)
  MPJ_KMEANS_DATA: "${MPJ_KMEANS_DATA:-/data/input/kmeans_data.csv}"
  MPJ_LOGREG_DATA: "${MPJ_LOGREG_DATA:-/data/input/logreg_data.csv}"
  KMEANS_DATASET_SIZE_MB: "${KMEANS_DATASET_SIZE_MB:-50}"
  LOGREG_DATASET_SIZE_MB: "${LOGREG_DATASET_SIZE_MB:-50}"
  # Swarm parity env hints (post-fix): point consumers at the NFS mount
  MPJ_SHARED_STORAGE: /data/shared_storage
  SHARED_STORAGE_PATH: /data/shared_storage
  PYTHONPATH: /app
  PYTHONUNBUFFERED: "1"

x-rank-deploy: &rank-deploy
  replicas: 1
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 5

x-data-mount: &data-mount
  type: bind
  source: /srv/mpj-share
  target: /data

services:
  mpi-root:
    image: mpj-spark:latest
    hostname: mpi-root
    working_dir: /data
    command: ["sleep", "infinity"]
    environment:
      <<: *common-env
      MPI_SIZE: "${MPI_SIZE:-3}"
      MPI_HOSTS: "${MPI_HOSTS:-mpi-root,mpi-worker-1,mpi-worker-2}"
    volumes:
      - *data-mount
    networks:
      mpj-net:
        aliases: [mpi-root]
    endpoint_mode: dnsrr
    deploy:
      <<: *rank-deploy
      placement:
        constraints:
          - node.hostname == swarm-manager

  mpi-worker-1:
    image: mpj-spark:latest
    hostname: mpi-worker-1
    working_dir: /data
    environment:
      <<: *common-env
      MPI_SIZE: "${MPI_SIZE:-3}"
      MPI_HOSTS: "${MPI_HOSTS:-mpi-root,mpi-worker-1,mpi-worker-2}"
    volumes:
      - *data-mount
    networks:
      mpj-net:
        aliases: [mpi-worker-1]
    endpoint_mode: dnsrr
    deploy:
      <<: *rank-deploy
      placement:
        constraints:
          - node.hostname == swarm-worker1

  mpi-worker-2:
    image: mpj-spark:latest
    hostname: mpi-worker-2
    working_dir: /data
    environment:
      <<: *common-env
      MPI_SIZE: "${MPI_SIZE:-3}"
      MPI_HOSTS: "${MPI_HOSTS:-mpi-root,mpi-worker-1,mpi-worker-2}"
    volumes:
      - *data-mount
    networks:
      mpj-net:
        aliases: [mpi-worker-2]
    endpoint_mode: dnsrr
    deploy:
      <<: *rank-deploy
      placement:
        constraints:
          - node.hostname == swarm-worker2

networks:
  mpj-net:
    external: true
