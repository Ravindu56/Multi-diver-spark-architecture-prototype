# Overlay: 5-rank topology (dedicated root + 2 co-located on each worker VM).
# Usage: docker stack deploy -c stack-mpj-spark.yml -c stack-mpj-spark.4w.yml mpj
#
# Experimental purpose: measure co-location penalty with minimal rank count.
# Total vCPUs held constant (3 VMs x 2 vCPU = 6); ranks split 1-2-2.
#
# Each worker VM now hosts 2 ranks (2 vCPU / 2 ranks = 1 core/rank), so every
# rank on a co-located VM -- including the base-file dedicated services --
# gets SLOTS_OVERRIDE=1 and SPARK_DRIVER_MEMORY=400m to size its Spark
# core/heap budget deterministically instead of nproc/proportional (see
# mpj_spark/workers/spark_session.py FIX 5/6).
#
# IMPORTANT: mpirun spawns remote ranks over ssh with a bare login env --
# Docker-level `environment:` values are NOT inherited by that session.
# The measurement mpirun command MUST forward these with
# `-x SPARK_DRIVER_MEMORY -x SLOTS_OVERRIDE` (in addition to the existing
# -x PYTHONPATH -x PYTHONUNBUFFERED), which forwards the value from
# mpi-root's OWN environment -- hence these vars are set here on mpi-root
# too, not just on the co-located worker services.

services:
  mpi-root:
    environment:
      MPI_SIZE: "5"
      SPARK_DRIVER_MEMORY: "400m"
      SLOTS_OVERRIDE: "1"

  mpi-worker-1:
    environment:
      MPI_SIZE: "5"
      SPARK_DRIVER_MEMORY: "400m"
      SLOTS_OVERRIDE: "1"

  mpi-worker-2:
    environment:
      MPI_SIZE: "5"
      SPARK_DRIVER_MEMORY: "400m"
      SLOTS_OVERRIDE: "1"

  mpi-worker-3:
    image: mpj-spark:latest
    hostname: mpi-worker-3
    working_dir: /data
    environment:
      SPARK_LOCAL_IP: 0.0.0.0
      NFS_SERVER: "${NFS_SERVER:-192.168.122.224}"
      NFS_SHARE: "${NFS_SHARE:-/srv/mpj-share}"
      NFS_CONTAINER_SHARE: "${NFS_CONTAINER_SHARE:-/srv/mpj-share}"
      MPJ_SHARED_STORAGE: /data/shared_storage
      SHARED_STORAGE_PATH: /data/shared_storage
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      SPARK_DRIVER_MEMORY: "400m"
      SLOTS_OVERRIDE: "1"
      MPI_RANK: "3"
      MPI_SIZE: "5"
    volumes:
      - type: bind
        source: /srv/mpj-share
        target: /data
    networks:
      mpj-net:
        aliases: [mpi-worker-3]
    deploy:
      endpoint_mode: dnsrr
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      placement:
        constraints:
          - node.hostname == swarm-worker1

  mpi-worker-4:
    image: mpj-spark:latest
    hostname: mpi-worker-4
    working_dir: /data
    environment:
      SPARK_LOCAL_IP: 0.0.0.0
      NFS_SERVER: "${NFS_SERVER:-192.168.122.224}"
      NFS_SHARE: "${NFS_SHARE:-/srv/mpj-share}"
      NFS_CONTAINER_SHARE: "${NFS_CONTAINER_SHARE:-/srv/mpj-share}"
      MPJ_SHARED_STORAGE: /data/shared_storage
      SHARED_STORAGE_PATH: /data/shared_storage
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      SPARK_DRIVER_MEMORY: "400m"
      SLOTS_OVERRIDE: "1"
      MPI_RANK: "4"
      MPI_SIZE: "5"
    volumes:
      - type: bind
        source: /srv/mpj-share
        target: /data
    networks:
      mpj-net:
        aliases: [mpi-worker-4]
    deploy:
      endpoint_mode: dnsrr
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      placement:
        constraints:
          - node.hostname == swarm-worker2
