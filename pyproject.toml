[build-system]
requires = ["setuptools>=40", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpj-spark"
version = "0.3.0"
description = "Multi-driver Spark architecture prototype for distributed ML training"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=3.3",
    "mpi4py>=3.1",
    "numpy>=1.24",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
include = ["mpj_spark*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear (common bugs)
    "UP",  # pyupgrade (modern Python syntax)
]
ignore = [
    "E501",  # line too long — enforced by formatter only
    "B008",  # function calls in default args — used in argparse defaults
    "B007",  # loop variable not used — false positives in Spark lambdas
]

[tool.ruff.lint.per-file-ignores]
"scripts/*"           = ["B", "UP"]   # scripts are intentionally looser
"mpj_spark_prototype*.py" = ["E", "W", "F", "I", "B", "UP"]  # legacy root files

[tool.ruff.format]
quote-style   = "double"
indent-style  = "space"
line-ending   = "lf"
