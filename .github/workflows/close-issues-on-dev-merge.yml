name: Close Linked Issues on Dev Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - dev

jobs:
  close-issues:
    name: Close issues referenced in merged PR
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      issues: write

    steps:
      - name: Parse and close linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const pattern = /(?:closes?|fixes?|resolves?)\s+#(\d+)/gi;
            const numbers = [];
            let match;

            while ((match = pattern.exec(body)) !== null) {
              numbers.push(parseInt(match[1], 10));
            }

            if (numbers.length === 0) {
              console.log('No linked issue numbers found in PR body.');
              return;
            }

            for (const num of numbers) {
              try {
                await github.rest.issues.update({
                  owner:        context.repo.owner,
                  repo:         context.repo.repo,
                  issue_number: num,
                  state:        'closed',
                  state_reason: 'completed',
                });
                await github.rest.issues.createComment({
                  owner:        context.repo.owner,
                  repo:         context.repo.repo,
                  issue_number: num,
                  body:         `Closed automatically by PR #${context.payload.pull_request.number} merged into \`dev\`.`,
                });
                console.log(`Closed issue #${num}`);
              } catch (e) {
                console.error(`Failed to close issue #${num}: ${e.message}`);
              }
            }
