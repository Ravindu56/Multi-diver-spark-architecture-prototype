name: P4 Docker Validation

on:
  push:
    branches:
      - feature/p4-docker-containerization
    paths:
      - "docker/**"
      - "scripts/**"
      - "mpj_spark/**"
      - ".github/workflows/p4-docker-validation.yml"
      - "requirements.txt"
      - "README.md"
  pull_request:
    branches:
      - feature/p4-docker-containerization
    paths:
      - "docker/**"
      - "scripts/**"
      - "mpj_spark/**"
      - ".github/workflows/p4-docker-validation.yml"
      - "requirements.txt"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-validation:
    name: Docker Compose smoke validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate Bash scripts
        run: |
          bash -n scripts/run_docker.sh
          bash -n scripts/validate_p4_09.sh
          bash -n scripts/validate_p4_05_wordcount.sh
          bash -n scripts/validate_p4_06_kmeans.sh
          bash -n scripts/validate_p4_07_logreg.sh

      - name: Validate Compose configuration
        run: |
          docker compose -f docker/docker-compose.yml config --quiet
          docker compose -f docker/docker-compose.yml config

      - name: Build MPI-Spark image
        run: |
          docker compose -f docker/docker-compose.yml build

      - name: Start Docker cluster
        run: |
          docker compose -f docker/docker-compose.yml up -d
          docker compose -f docker/docker-compose.yml ps

      - name: Verify all services are running
        run: |
          for service in mpi-root mpi-worker-1 mpi-worker-2; do
            status="$(docker inspect -f '{{.State.Running}}' "${service}")"
            test "${status}" = "true"
          done

      - name: Verify root container environment
        run: |
          docker exec mpi-root bash -lc '
            set -e
            cd /app
            python3 --version
            mpirun --version
            python3 -c "import pyspark, mpi4py; print(\"PySpark and mpi4py imports passed\")"
            test -f /etc/mpi/hostfile
            test -f scripts/sync_overhead_benchmark.py
            test -x /entrypoint.sh
          '

      - name: Run P4-09 deployment acceptance checks
        run: |
          chmod +x scripts/run_docker.sh scripts/validate_p4_09.sh
          ./scripts/validate_p4_09.sh

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml ps || true
          docker compose -f docker/docker-compose.yml logs --no-color || true
          docker inspect mpi-root || true

      - name: Tear down Docker cluster
        if: always()
        run: docker compose -f docker/docker-compose.yml down --remove-orphans -v
