# .github/workflows/lint.yml
# Runs ruff lint + format check on every PR targeting dev or main.
# Pinned to ruff 0.4.10 — matches local dev toolchain.

name: Lint

on:
  pull_request:
    branches: [dev, main, "feature/**"]

jobs:
  ruff:
    name: ruff 0.4.10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff==0.4.10"

      - name: ruff check (lint)
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .
