name: Lint

on:
  pull_request:
    branches:
      - dev
      - master
  push:
    branches:
      - dev
      - master

jobs:
  ruff:
    name: Ruff Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff==0.4.10

      - name: Run ruff linter
        run: |
          ruff check . \
            --exclude mpj_spark/benchmarks/reporter.py \
            --output-format=github

      - name: Run ruff formatter check
        run: |
          ruff format --check . \
            --exclude mpj_spark/benchmarks/reporter.py
