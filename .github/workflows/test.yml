# =============================================================
# .github/workflows/test.yml
#
# CI workflow: Phase 1 & 2 Unit Tests
#
# Triggers:
#   - Every push to dev or any feature/* branch
#   - Every pull request targeting dev
#
# Job: install deps → run pytest → upload coverage artifact
# =============================================================
name: Phase 1-2 Unit Tests

on:
  push:
    branches:
      - dev
      - "feature/**"
  pull_request:
    branches:
      - dev

jobs:
  unit-tests:
    name: Run Unit Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source ──────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ─────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Java setup (required for PySpark JVM) ────────────
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      # ── 4. Install dependencies ──────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 5. Run unit tests with coverage ─────────────────────
      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=mpj_spark \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      # ── 6. Upload coverage report as artifact ───────────────
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
